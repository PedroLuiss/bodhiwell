  <p class="copy">Ejemplo aislado del buscador para revisión visual y validación de comportamiento sin mezclarlo con otras pantallas.</p>

  <div class="shell" id="searchShell">
    <iframe id="searchFrame" src="../patterns/search/index.html" title="Buscador Bodhiwell" loading="lazy" scrolling="no"></iframe>
  </div>
</div>

<script>
  const searchFrame = document.getElementById("searchFrame");
  const searchShell = document.getElementById("searchShell");

  function sendFlowerPlay(isVisible = true){
    if (!searchFrame?.contentWindow) return;
    searchFrame.contentWindow.postMessage(
      {
        type: "bw-search-visibility",
        playFlower: !!isVisible
      },
      "*"
    );
  }

  searchFrame.addEventListener("load", () => {
    sendFlowerPlay(true);
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      sendFlowerPlay(entry.isIntersecting);
    });
  }, { threshold: 0.35 });

  if (searchShell) observer.observe(searchShell);
</script>
