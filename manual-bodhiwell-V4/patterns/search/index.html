<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bodhiwell Buscador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=1" />

<style id="bw-typography-guard">body,body *{font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-style:normal}input,button,textarea,select{font:inherit}code,pre{font-style:normal}</style>
<link rel="stylesheet" href="../../assets/css/coherence.css">
</head>
<body>

<section class="bw-container" id="bwContainer" data-dim="">

    <!-- IZQUIERDA -->
    <div class="bw-left">
      <div class="bw-left-inner">
        <h1 class="bw-title"><span>Encontrá lo </span><span>que necesitás</span></h1>
        <p class="bw-sub">Explorá profesionales y enfoques según tu momento, tu búsqueda o la forma en que preferís acompañar tu bienestar.</p>
      </div>
    </div>

    <!-- CENTRO -->
    <div class="bw-center" id="bwCenter">

      <video
        class="bw-media bw-video"
        id="flowerVideo"
        src="./assets/flor.webm"
        muted
        playsinline
      ></video>

      <img class="bw-media bw-fallback" id="flowerFallback" src="./assets/flor.png" alt="" aria-hidden="true" />

      <!-- SVG REAL -->
      <div class="bw-svg-wrap" id="svgWrap" aria-label="Flor interactiva">

        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="svg2" width="533.33331" height="533.33331" viewBox="0 0 533.33331 533.33331">
          <defs id="defs6">
            <clipPath clipPathUnits="userSpaceOnUse" id="clipPath16">
              <path d="M 0,400 H 400 V 0 H 0 Z" id="path14" />
            </clipPath>
          </defs>
          <g id="g8" transform="matrix(1.3333333,0,0,-1.3333333,0,533.33333)">
            <g id="g10">
              <g id="g12" clip-path="url(#clipPath16)">
                <g id="g18" transform="translate(102.2837,299.1343)">
                  <path d="m 0,0 c -1.239,-0.959 42.203,15.853 95.139,-20.599 4.909,-3.367 0.421,11.995 0.28,17.933 -0.701,29.695 -0.473,66.993 -70.219,88.106 -69.747,21.114 -115.644,3.625 -115.644,3.625 0,0 -18.49,-44.898 2.624,-114.644 21.113,-69.747 59.412,-70.519 89.106,-71.22 9.048,-0.21 35.025,-3.203 27.146,0.748 C -4.816,-79.45 -9.586,-7.856 0,0" style="fill:#ffffff;fill-opacity:1;fill-rule:nonzero;stroke:none" id="petalo-cuerpo" class="bw-petal" tabindex="0" role="button" aria-label="Seleccionar dimensión: Cuerpo" />
                </g>
                <g id="g22" transform="translate(199.8071,198.6875)">
                  <path d="m 0,0 v 0 m 76.247,3.975 c 6.429,-0.304 13,-0.491 19.453,-0.35 29.694,0.701 67.993,1.473 89.106,71.219 21.113,69.746 4.624,114.644 4.624,114.644 0,0 -45.897,17.49 -115.643,-3.624 C 4.04,164.75 2.268,127.452 1.567,97.758 1.356,88.943 1.8,79.895 2.268,71.29 c 0,0 56.77,53.333 98.786,30.302 C 122.332,54.806 76.855,-1.87 76.247,3.975" style="fill:#ffffff;fill-opacity:1;fill-rule:nonzero;stroke:none" id="petalo-mente" class="bw-petal" tabindex="0" role="button" aria-label="Seleccionar dimensión: Mente" />
                </g>
                <g id="g26" transform="translate(302.8721,100.416)">
                  <path d="m 0,0 c -82.887,-22.353 -100.797,39.726 -100.517,31.635 1.006,-29.695 0.748,-95.279 70.496,-116.392 69.746,-21.113 115.643,-3.624 115.643,-3.624 0,0 17.489,45.898 -3.624,115.644 -21.113,69.747 -108.816,73.37 -108.816,73.37 0,0 48.54,-62.428 24.948,-100.446" style="fill:#ffffff;fill-opacity:1;fill-rule:nonzero;stroke:none" id="petalo-energia" class="bw-petal" tabindex="0" role="button" aria-label="Seleccionar dimensión: Energía" />
                </g>
                <g id="g30" transform="translate(131.7207,197.8467)">
                  <path d="m 0,0 c -9.095,0.537 -18.775,1.028 -28.151,0.817 -29.694,-0.701 -67.993,-1.472 -89.106,-71.218 -21.114,-69.747 -3.624,-115.645 -3.624,-115.645 0,0 45.897,-17.489 115.644,3.624 68.975,20.88 72.225,58.875 72.949,88.429 0.024,0.654 0.071,1.286 0.164,1.917 1.029,6.757 6.874,46.645 -2.385,21.137 -10.1,-27.801 -81.297,-38.744 -95.325,-26.702 -14.053,12.041 1.192,91.772 28.688,96.962" style="fill:#ffffff;fill-opacity:1;fill-rule:nonzero;stroke:none" id="petalo-conciencia" class="bw-petal" tabindex="0" role="button" aria-label="Seleccionar dimensión: Conciencia" />
                </g>
              </g>
            </g>
          </g>
        </svg>

      </div>
    </div>

    <!-- DERECHA -->
    <div class="bw-right" id="bwRight">
      <div class="bw-right-inner">

        <div class="bw-search">
          <input id="searchInput" type="text" placeholder="Buscá por nombre, profesión o síntoma" autocomplete="off" />
          <button class="bw-infield-btn" id="searchBtn" aria-label="Buscar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 18a8 8 0 1 1 5.293-14.293A8 8 0 0 1 10 18Zm0-2a6 6 0 1 0-4.243-1.757A6 6 0 0 0 10 16Zm9.707 4.293-4.2-4.2 1.414-1.414 4.2 4.2-1.414 1.414Z"/>
            </svg>
          </button>
        </div>

        <div class="bw-stage" id="stage" aria-live="polite">
          <span class="bw-stage-arrow" id="stageArrow" aria-hidden="true">←</span>
          <div class="bw-stage-text">
            <div class="bw-stage-title" id="stageTitle">Encontrá lo que necesitás</div>
            <div class="bw-stage-sub" id="stageSub">
              Cuerpo, mente, energía o conciencia.
              Todo está conectado. Empezá por donde lo sientas.
            </div>
          </div>
        </div>

        <div class="bw-panel" id="tagsPanel">
          <div class="bw-tags" id="tagsWrap"></div>
          <button class="bw-more is-hidden" id="moreBtn" type="button"></button>
        </div>

      </div>
    </div>

  </section>

  <script src="./data/data.js"></script>
  <script src="./data/data-specialties.js"></script>
  <script src="./scripts/app.js"></script>
</body>
</html>
