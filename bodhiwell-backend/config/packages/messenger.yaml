framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async_emails:
                dsn: "%env(REDIS_URL)%"
                options:
                    # Nombre único del stream para este proyecto
                    stream: "mail_queue_bodhiwell"
                    # Nombre del grupo de consumidores
                    group: "mail_workers"
                    # Tiempo máximo de espera para mensajes
                    stream_max_entries: 10000
                    delete_after_ack: true
                retry_strategy:
                    max_retries: 3
                    delay: 10000 # 10 segundos
                    multiplier: 2
                    max_delay: 60000

            # failed: 'doctrine://default?queue_name=failed'
            sync: "sync://"

        routing:
            # Route your messages to the transports
            'App\Message\SendMassiveEmailMessage': async_emails
            'App\Message\SendBookingEmailMessage': async_emails

when@test:
    framework:
        messenger:
            transports:
                # replace with your transport name here (e.g., my_transport: 'in-memory://')
                # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
                async_emails: "in-memory://"
